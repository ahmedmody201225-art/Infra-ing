<style>
:root{--navy:#7B1E3A;--gold:#C9A24B;--gold-d:#A8842F;--red:#C0392B;--green:#1E8449;--purple:#7D3C98;--bg:#FAF6F1;--card:#fff;--ink:#1F2937;--mute:#6B7280;--line:#EADFD3;
--red-t:#FDEDEC;--green-t:#E9F7EF;--purple-t:#F4ECF7;--navy-t:#F3E3E8;--accent:var(--red)}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Cairo',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;min-height:100vh}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.app{display:flex;min-height:100vh}
#side{width:236px;flex:none;background:linear-gradient(180deg,#5A1229,#7B1E3A);color:#fff;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;border-inline-start:3px solid var(--gold);z-index:40;box-shadow:-2px 0 14px rgba(0,0,0,.18)}
.content{flex:1;min-width:0}
.brand{font-weight:800;font-size:24px;letter-spacing:1px;color:var(--gold);padding:22px 18px 16px;border-bottom:1px solid rgba(201,162,75,.35)}
.brand small{display:block;font-weight:400;font-size:11px;color:#f0dfe4;opacity:.85;letter-spacing:0;margin-top:2px}
nav{display:flex;flex-direction:column;gap:4px;padding:14px 10px;flex:1;overflow-y:auto}
nav button{background:transparent;border:0;color:#f0dfe4;padding:12px 14px;border-radius:10px;cursor:pointer;font-weight:600;text-align:right;font-size:15px;display:flex;gap:10px;align-items:center;border-inline-start:3px solid transparent}
nav button:hover{background:rgba(201,162,75,.15)}
nav button.on{background:var(--gold);color:#4a0f20;border-inline-start-color:#fff}
.who{font-size:12px;display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-top:1px solid rgba(201,162,75,.35);align-items:flex-start}
.badge{padding:3px 9px;border-radius:99px;background:rgba(201,162,75,.25);color:var(--gold);font-size:11px;font-weight:600}
.badge.demo{background:var(--gold);color:#4a0f20}
#who{word-break:break-all;opacity:.85}
.mtop{display:none}
#bd{display:none}
.linkbtn{background:none;border:1px solid var(--gold);color:var(--gold);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:12px}
main{max-width:1200px;margin:auto;padding:18px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 1px 3px rgba(31,56,100,.05)}
h2{margin:0 0 14px;font-size:19px;color:var(--navy)}
h3{margin:0 0 10px;font-size:16px;color:var(--navy)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.seg button{border:2px solid var(--line);background:#fff;border-radius:14px;padding:14px 8px;font-weight:700;font-size:16px;cursor:pointer;color:var(--mute);transition:.15s}
.seg button small{display:block;font-weight:400;font-size:11px;margin-top:2px}
.seg button.on{color:#fff;border-color:transparent}
.seg button[data-c=expenses].on{background:var(--red)}
.seg button[data-c=revenues].on{background:var(--green)}
.seg button[data-c=clients].on{background:var(--purple)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{border-radius:14px;padding:12px 14px;border:1px solid var(--line);background:#fff}
.kpi .l{font-size:12px;color:var(--mute);font-weight:600}
.kpi .v{font-size:22px;font-weight:800;margin-top:2px}
.kpi.r .v{color:var(--red)}.kpi.g .v{color:var(--green)}.kpi.p .v{color:var(--purple)}.kpi.n .v{color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px 14px}
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:13px;font-weight:700;color:var(--ink)}
.f label b{color:var(--red)}
.f input,.f select{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;width:100%;min-height:44px}
.f input:focus,.f select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.f.amt input{font-weight:800;font-size:18px;text-align:center}
.f.hide{display:none}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:12px 22px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;min-height:46px}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.danger{background:var(--red)}
.btn.sm{padding:6px 12px;min-height:34px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:wait}
.status{margin-top:12px;padding:10px 14px;border-radius:10px;background:var(--navy-t);color:var(--navy);font-weight:600;font-size:14px}
.status.ok{background:var(--green-t);color:var(--green)}
.status.err{background:var(--red-t);color:var(--red)}
.recent{margin-top:18px}
.rrow{display:grid;grid-template-columns:70px 1fr auto auto;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line)}
.rrow:last-child{border:0}
.chip{font-size:12px;font-weight:700;border-radius:99px;padding:3px 10px;text-align:center}
.chip.expenses{background:var(--red-t);color:var(--red)}.chip.revenues{background:var(--green-t);color:var(--green)}.chip.clients{background:var(--purple-t);color:var(--purple)}
.rrow .d{color:var(--mute);font-size:12px}
.rrow .a{font-weight:800}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.tools input,.tools select{border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;background:#fff;min-height:40px}
.tools .grow{flex:1;min-width:160px}
.sum{margin-inline-start:auto;font-weight:700;color:var(--navy);font-size:14px}
.tw{overflow:auto;border:1px solid var(--line);border-radius:12px;max-height:68vh}
table{border-collapse:collapse;width:100%;min-width:640px;background:#fff}
th{position:sticky;top:0;background:var(--navy);color:#fff;border-bottom:3px solid var(--gold);font-size:13px;padding:10px 10px;text-align:right;white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
tr:hover td{background:#FAFCFF}

<script type="module">
/* ============================ ثوابت ============================ */
const CATS=[
 ['بنزين','السيارة'],['كارتة','السيارة'],['صيانة سيارة','السيارة'],
 ['أدوات مكتبية','المكتب والتشغيل'],['كراسة شروط','المكتب والتشغيل'],['فواتير متنوعة','المكتب والتشغيل'],['أجهزة مكتب','المكتب والتشغيل'],['بوفية','المكتب والتشغيل'],['نت وموبيل','المكتب والتشغيل'],
 ['غاز','المرافق والفواتير'],['كهرباء','المرافق والفواتير'],['فواتير شهرية','المرافق والفواتير'],
 ['ضرايب','الضرائب والتأمينات'],['تأمينات اجتماعية','الضرائب والتأمينات'],['تأمينات مشاريع','الضرائب والتأمينات'],
 ['علاج صحي','أخرى'],['فواتير اجتماعية','أخرى'],['تذاكر طيران','أخرى']];
const GROUP_OF=Object.fromEntries(CATS);
const SCHEMA={
 expenses:{title:'مصروف',sheet:'المصروفات',color:'var(--red)',fields:[
  {k:'date',l:'التاريخ',t:'date',req:1},
  {k:'category',l:'التصنيف',t:'select',req:1},
  {k:'desc',l:'البيان',t:'text',list:'dl_desc'},
  {k:'amount',l:'المبلغ',t:'money',req:1},

 revenues:{title:'إيراد',sheet:'الإيرادات',color:'var(--green)',fields:[
  {k:'date',l:'التاريخ',t:'date',req:1},
  {k:'party',l:'الجهة (البيان)',t:'text',req:1,list:'dl_party'},
  {k:'project',l:'عن مشروع',t:'text',list:'dl_proj'},
  {k:'amount',l:'المبلغ',t:'money',req:1},
  {k:'cheque',l:'رقم الشيك / التحويل',t:'text'},
  {k:'invoice',l:'موقف الفاتورة الإلكترونية',t:'text'},
  {k:'bank',l:'جهة الإيداع',t:'text',list:'dl_bank'},
  {k:'chkF',l:'ملف الشيك (PDF أو صورة)',t:'file'},
  {k:'invF',l:'ملف الفاتورة الإلكترونية (PDF أو صورة)',t:'file'}]},
 clients:{title:'دفعة عميل',sheet:'العملاء الخارجيين',color:'var(--purple)',fields:[
  {k:'date',l:'التاريخ',t:'date',req:1},
  {k:'name',l:'اسم العميل',t:'text',req:1,list:'dl_client'},
  {k:'project',l:'المشروع',t:'text',list:'dl_proj'},
  {k:'amount',l:'المبلغ',t:'money',req:1},
  {k:'note',l:'ملاحظات',t:'text'}]}};
const TABLE_COLS={
 expenses:[['date','التاريخ'],['category','التصنيف'],['desc','البيان'],['amount','المبلغ',1],['note','ملاحظات']],
 revenues:[['date','التاريخ'],['party','الجهة'],['project','المشروع'],['amount','المبلغ',1],['cheque','شيك/تحويل'],['invoice','الفاتورة'],['bank','الإيداع'],['chkF','📎 الشيك',0,1],['invF','📎 الفاتورة',0,1]],
 clients:[['date','التاريخ'],['name','العميل'],['project','المشروع'],['amount','المبلغ',1],['note','ملاحظات']]};
SCHEMA.invoices={title:'فاتورة',sheet:'متابعة الفواتير',color:'var(--navy)',fields:[
  {k:'party',l:'الجهة / الشركة',t:'text',list:'dl_party'},
  {k:'project',l:'المشروع',t:'text',req:1,list:'dl_proj'},
  {k:'no',l:'رقم الفاتورة',t:'text',req:1},
  {k:'date',l:'تاريخ الفاتورة',t:'date',req:1},
  {k:'forMonth',l:'عن شهر',t:'month'},
  {k:'amount',l:'المبلغ',t:'money',req:1},
  {k:'stage',l:'المرحلة الحالية',t:'stagesel'},
  {k:'note',l:'ملاحظات',t:'text'}]};
const COLNAMES=['expenses','revenues','clients'];
const ICONS={entry:'✍️',expenses:'💸',revenues:'💰',clients:'👥',dash:'📊',track:'🧾',fin:'📒',settings:'⚙️'};
const VIEWS=[['entry','إدخال'],['expenses','المصروفات'],['revenues','الإيرادات'],['clients','العملاء'],['track','متابعة الفواتير'],['dash','الداشبورد'],['fin','القوائم والدفاتر'],['settings','الإعدادات']];

/* ============================ أدوات ============================ */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(Number(n)||0).toLocaleString('en-US',{maximumFractionDigits:2});
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const num2en=s=>String(s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[٫]/g,'.').replace(/[٬،,\s]/g,'');
const parseMoney=s=>{const n=parseFloat(num2en(s));return isFinite(n)?n:NaN};
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600)}
const uniqByFreq=a=>{const m=new Map();a.forEach(x=>{x=String(x||'').trim();if(x)m.set(x,(m.get(x)||0)+1)});return [...m].sort((a,b)=>b[1]-a[1]).map(x=>x[0])};
const sum=a=>a.reduce((s,x)=>s+(Number(x.amount)||0),0);

/* ============================ طبقة البيانات ============================ */
const cfg=window.FIREBASE_CONFIG||{};
const FB=!!(cfg.apiKey&&cfg.projectId);
let store;
if(!FB){
  const mem={};const subs={};
  const load=c=>{try{return JSON.parse(localStorage.getItem('infra_v1_'+c)||'[]')}catch(e){return mem[c]||[]}};
  const save=(c,a)=>{mem[c]=a;try{localStorage.setItem('infra_v1_'+c,JSON.stringify(a))}catch(e){}};
  const emit=c=>(subs[c]||[]).forEach(f=>f(load(c).map(x=>({...x}))));
  store={
    mode:'demo',
    subscribe(c,cb){(subs[c]=subs[c]||[]).push(cb);setTimeout(()=>cb(load(c)),0)},
    async add(c,o){const a=load(c);const id='l'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);a.push({...o,id});save(c,a);emit(c);return id},
    async update(c,id,o){const a=load(c).map(x=>x.id===id?{...x,...o}:x);save(c,a);emit(c)},
    async remove(c,id){save(c,load(c).filter(x=>x.id!==id));emit(c)},
    async removeMany(c,ids){const s=new Set(ids);save(c,load(c).filter(x=>!s.has(x.id)));emit(c)},
    async importRows(c,rows){const a=load(c);const idx=new Map(a.map((x,i)=>[x.id,i]));rows.forEach(r=>{if(idx.has(r.id))a[idx.get(r.id)]={...r};else a.push({...r})});save(c,a);emit(c)},
    async putFile(file){const fid='f'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);const url=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)});let m={};try{m=JSON.parse(localStorage.getItem('infra_v1_files')||'{}')}catch(e){}m[fid]=url;try{localStorage.setItem('infra_v1_files',JSON.stringify(m))}catch(e){throw new Error('مساحة التخزين التجريبي ممتلئة')}return {fid,n:1,name:file.name,size:file.size,type:file.type}},
    async getFile(meta){const m=JSON.parse(localStorage.getItem('infra_v1_files')||'{}');return await (await fetch(m[meta.fid])).blob()},
    async delFile(meta){try{const m=JSON.parse(localStorage.getItem('infra_v1_files')||'{}');delete m[meta.fid];localStorage.setItem('infra_v1_files',JSON.stringify(m))}catch(e){}},
    onAuth(cb){setTimeout(()=>cb({email:'وضع تجريبي'}),0)},
    async signIn(){},async signOut(){},
    resetLocal(){COLNAMES.forEach(c=>save(c,[]));COLNAMES.forEach(emit)}
  };
}else{
  const V='10.12.2',B='https://www.gstatic.com/firebasejs/'+V+'/';
  let appM,authM,fsM;
  try{[appM,authM,fsM]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')])}catch(e){document.body.innerHTML='<p style="padding:30px;font-family:Cairo,Tahoma;text-align:center">مقدرتش أحمّل Firebase — اتأكد من النت وجرب تاني.</p>';throw e}
  const app=appM.initializeApp(cfg);
  const auth=authM.getAuth(app);
  let db;
  try{db=fsM.initializeFirestore(app,{localCache:fsM.persistentLocalCache({tabManager:fsM.persistentMultipleTabManager()})})}catch(e){db=fsM.getFirestore(app)}
  const chunks=(a,n)=>{const r=[];for(let i=0;i<a.length;i+=n)r.push(a.slice(i,i+n));return r};
  store={
    mode:'firebase',
    subscribe(c,cb){fsM.onSnapshot(fsM.collection(db,c),s=>cb(s.docs.map(d=>({...d.data(),id:d.id}))),e=>{console.error(e);toast('مشكلة في الاتصال بالداتابيز: '+(e.code||e.message))})},
    async add(c,o){const r=await fsM.addDoc(fsM.collection(db,c),{...o,by:auth.currentUser?.email||''});return r.id},
    async update(c,id,o){await fsM.updateDoc(fsM.doc(db,c,id),o)},
    async remove(c,id){await fsM.deleteDoc(fsM.doc(db,c,id))},
    async removeMany(c,ids){for(const ch of chunks(ids,400)){const b=fsM.writeBatch(db);ch.forEach(id=>b.delete(fsM.doc(db,c,id)));await b.commit()}},
    async importRows(c,rows){for(const ch of chunks(rows,400)){const b=fsM.writeBatch(db);ch.forEach(r=>{const {id,...rest}=r;b.set(fsM.doc(db,c,id),{...rest,by:'import'})});await b.commit()}},
    async putFile(file){
      const fid='f'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
      const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=rej;r.readAsDataURL(file)});
      const parts=[];for(let i=0;i<b64.length;i+=700000)parts.push(b64.slice(i,i+700000));
      for(let i=0;i<parts.length;i++)await fsM.setDoc(fsM.doc(db,'files',fid+'_'+i),{fid,i,n:parts.length,data:parts[i],by:auth.currentUser?.email||''});
      return {fid,n:parts.length,name:file.name,size:file.size,type:file.type||'application/pdf'};
    },
    async getFile(meta){
      const ds=await Promise.all(Array.from({length:meta.n},(_,i)=>fsM.getDoc(fsM.doc(db,'files',meta.fid+'_'+i))));
      const bin=ds.map(d=>atob(d.data().data)).join('');
      const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
      return new Blob([u],{type:meta.type||'application/pdf'});
    },
    async delFile(meta){for(let i=0;i<meta.n;i++)await fsM.deleteDoc(fsM.doc(db,'files',meta.fid+'_'+i))},
    onAuth(cb){authM.onAuthStateChanged(auth,u=>cb(u?{email:u.email}:null))},
    async signIn(e,p){await authM.signInWithEmailAndPassword(auth,e,p)},

function ensureDL(id){let d=document.getElementById(id);if(!d){d=document.createElement('datalist');d.id=id;document.body.appendChild(d)}return d}

function refreshLists(){

function allCategories(){const extra=uniqByFreq(data.expenses.map(x=>x.category)).filter(c=>!GROUP_OF[c]);return [...CATS.map(c=>c[0]),...extra]}

/* ============================ نموذج عام ============================ */
function buildForm(col,vals,{onSubmit,submitLabel,onCancel,idp}){
  const sc=SCHEMA[col];idp=idp||'f_';
  const f=document.createElement('form');f.autocomplete='off';
  f.style.setProperty('--accent',sc.color);
  f.innerHTML='<div class="grid">'+sc.fields.map(fl=>{
    let inp;
    if(fl.t==='select')inp='<select id="'+idp+fl.k+'"><option value="">— اختار —</option>'+allCategories().map(c=>'<option'+(vals[fl.k]===c?' selected':'')+'>'+esc(c)+'</option>').join('')+'</select>';
    else if(fl.t==='file'){const cur=vals[fl.k];inp='<input id="'+idp+fl.k+'" type="file" accept="application/pdf,image/*">'+(cur&&cur.fid?'<div class="muted" style="margin-top:4px">الملف الحالي: <b>'+esc(cur.name)+'</b> — <label style="font-weight:400"><input type="checkbox" data-rmf="'+fl.k+'" style="width:auto;min-height:0"> إزالة</label> (أو اختار ملف جديد يستبدله)</div>':'')}
    else if(fl.t==='month')inp='<input id="'+idp+fl.k+'" type="month" value="'+esc(vals[fl.k]||'')+'">';
    else if(fl.t==='stagesel')inp='<select id="'+idp+fl.k+'">'+STAGES.map((l,i)=>'<option value="'+(i+1)+'"'+((vals[fl.k]||1)===i+1?' selected':'')+'>'+(i+1)+'. '+l+'</option>').join('')+'</select>';
    else if(fl.t==='date')inp='<input id="'+idp+fl.k+'" type="date" value="'+esc(vals[fl.k]||'')+'">';
    else if(fl.t==='money')inp='<input id="'+idp+fl.k+'" type="text" inputmode="decimal" placeholder="0.00" value="'+esc(vals[fl.k]??'')+'">';
    else inp='<input id="'+idp+fl.k+'" type="text"'+(fl.list?' list="'+fl.list+'"':'')+' value="'+esc(vals[fl.k]??'')+'">';
    return '<div class="f'+(fl.t==='money'?' amt':'')+'" data-k="'+fl.k+'"><label>'+fl.l+(fl.req?' <b>*</b>':'')+'</label>'+inp+'</div>';
  }).join('')+'</div><div class="status hidden" data-st></div><div class="actions"><button class="btn" data-sub>'+submitLabel+'</button>'+(onCancel?'<button type="button" class="btn ghost" data-cancel>إلغاء</button>':'')+'</div>';
  const get=()=>{const v={};sc.fields.forEach(fl=>{if(fl.t==='file')return;const el=f.querySelector('#'+idp+fl.k);v[fl.k]=el?el.value.trim():''});return v};
  const toggle=()=>{const v=get();sc.fields.forEach(fl=>{if(fl.showIf){f.querySelector('[data-k='+fl.k+']').classList.toggle('hide',!fl.showIf(v))}})};
  toggle();
  const cat=f.querySelector('#'+idp+'category');
  if(cat)cat.addEventListener('change',()=>{toggle();refreshDesc(cat.value)});
  f.addEventListener('submit',async e=>{
    e.preventDefault();
    const v=get(),st=f.querySelector('[data-st]');
    const err=(m,k)=>{st.className='status err';st.textContent=m;st.classList.remove('hidden');f.querySelector('#'+idp+k)?.focus()};
    for(const fl of sc.fields){
      if(fl.showIf&&!fl.showIf(v))v[fl.k]='';
      if(fl.req&&!v[fl.k])return err('لازم تملا: '+fl.l,fl.k);
    }
    if(!/^\d{4}-\d{2}-\d{2}$/.test(v.date))return err('اكتب تاريخ صحيح','date');
    const a=parseMoney(v.amount);
    if(!(a>0))return err('اكتب مبلغ صحيح أكبر من صفر','amount');
    v.amount=Math.round(a*100)/100;
    const fileFields=sc.fields.filter(fl=>fl.t==='file');
    for(const fl of fileFields){const el=f.querySelector('#'+idp+fl.k);if(el&&el.files[0]&&el.files[0].size>6*1024*1024)return err('الملف أكبر من 6 ميجا: '+el.files[0].name,fl.k)}
    const b=f.querySelector('[data-sub]');b.disabled=true;
    try{
      const old=[];
      for(const fl of fileFields){
        const el=f.querySelector('#'+idp+fl.k),cur=vals[fl.k],rm=f.querySelector('[data-rmf='+fl.k+']');
        if(el&&el.files[0]){st.className='status';st.textContent='جاري رفع الملف: '+el.files[0].name+' ...';st.classList.remove('hidden');v[fl.k]=await store.putFile(el.files[0]);if(cur&&cur.fid)old.push(cur)}
        else if(rm&&rm.checked){v[fl.k]=null;if(cur&&cur.fid)old.push(cur)}
      }
      await onSubmit(v,f,st);
      old.forEach(m=>store.delFile(m).catch(()=>{}));
    }catch(ex){console.error(ex);err('ماتسجلش — '+(ex.code||ex.message||'مشكلة في الحفظ'),'date')}
    b.disabled=false;
  });
  f.querySelector('[data-cancel]')?.addEventListener('click',onCancel);
  return f;
}

const lastKeep={};
function mountEntryForm(){
  const col=entryCol,sc=SCHEMA[col],box=$('#eform');if(!box)return;
  box.style.setProperty('--accent',sc.color);
  const init={date:lastKeep[col+'date']||today(),category:lastKeep.category||''};
  box.innerHTML='<h2 style="color:'+sc.color+'">تسجيل '+sc.title+'</h2>';
  const f=buildForm(col,init,{submitLabel:'تسجيل '+sc.title,onSubmit:async(v,form,st)=>{
    await store.add(col,{...v,t:Date.now()});
    form.querySelectorAll('input[type=file]').forEach(i=>i.value='');
    lastKeep[col+'date']=v.date;if(col==='expenses')lastKeep.category=v.category;
    const keep=['date'].concat(col==='expenses'?['category']:[]);
    sc.fields.forEach(fl=>{if(!keep.includes(fl.k)){const el=form.querySelector('#f_'+fl.k);if(el)el.value=''}});
    st.className='status ok';st.textContent='تم تسجيل '+sc.title+' '+fmt(v.amount)+' ج.م في '+sc.sheet+'  ✓';st.classList.remove('hidden');
    toast('تم التسجيل ✓');
    const first=sc.fields.find(fl=>!keep.includes(fl.k)&&fl.t!=='select');

}
function renderEntryKpi(){

function renderRecent(){

    return '<div class="rrow"><span class="chip '+c+'">'+SCHEMA[c].title+'</span><span>'+esc(name)+' <span class="d">· '+esc(where)+' · '+esc(x.date)+'</span></span><span class="a">'+fmt(x.amount)+'</span><button class="ib" title="حذف" data-del="'+c+'|'+x.id+'">🗑</button></div>';
  }).join(''):'<div class="empty">لسه ما سجلتش حاجة من الصفحة دي</div>';
  r.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>delRow(...b.dataset.del.split('|')));
}
async function fileAct(col,key,mode){
  const [id,k]=key.split('|'),x=data[col].find(r=>r.id===id),m=x&&x[k];if(!m)return;
  const w=mode==='open'?window.open('','_blank'):null;
  try{
    toast('جاري تحميل الملف...');
    const blob=await store.getFile(m),url=URL.createObjectURL(blob);
    if(mode==='open'){if(w)w.location.href=url;else location.href=url}
    else{
      const fr=document.createElement('iframe');fr.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';fr.src=url;
      fr.onload=()=>{try{fr.contentWindow.focus();fr.contentWindow.print()}catch(e){window.open(url,'_blank')}setTimeout(()=>fr.remove(),60000)};
      document.body.appendChild(fr);
    }
    setTimeout(()=>URL.revokeObjectURL(url),120000);
  }catch(e){if(w)w.close();console.error(e);toast('ماقدرتش أفتح الملف: '+(e.code||e.message))}
}
async function delRow(c,id){
  if(!confirm('متأكد إنك عايز تمسح العملية دي؟'))return;
  const x=data[c].find(r=>r.id===id);
  try{await store.remove(c,id);if(x)for(const k of ['chkF','invF'])if(x[k]&&x[k].fid)store.delFile(x[k]).catch(()=>{});toast('اتمسحت')}catch(e){toast('ماتمسحتش: '+(e.code||e.message))}
}

function filtered(col){
  const q=ui.q.trim().toLowerCase();
  return sortRows(data[col]).filter(x=>(!ui.month||(x.date||'').startsWith(ui.month))&&(col!=='expenses'||!ui.cat||x.category===ui.cat)&&(!q||Object.values(x).some(v=>String(v).toLowerCase().includes(q))));
}
function tableBody(col){
  const t=$('#tbl');if(!t)return;
  const rows=filtered(col),cols=TABLE_COLS[col];
  $('#tsum').textContent=rows.length+' عملية — الإجمالي '+fmt(sum(rows))+' ج.م';
  if(!rows.length){t.innerHTML='<div class="empty">مفيش بيانات مطابقة</div>';return}
  const shown=rows.slice(0,ui.limit);
  t.innerHTML='<table><thead><tr>'+cols.map(c=>'<th class="'+(c[2]?'num':'')+'">'+c[1]+'</th>').join('')+'<th></th></tr></thead><tbody>'+shown.map(x=>'<tr>'+cols.map(c=>{
    let val=x[c[0]];
    if(c[3]){const m=x[c[0]];return '<td class="act" style="text-align:center">'+(m&&m.fid?'<button class="ib" title="فتح '+esc(m.name)+'" data-fo="'+x.id+'|'+c[0]+'">📄</button><button class="ib" title="طباعة" data-fp="'+x.id+'|'+c[0]+'">🖨️</button>':'<span class="muted">—</span>')+'</td>'}
    if(c[0]==='note'&&x.place)val=(val?val+' — ':'')+'مكان: '+x.place;
    return '<td class="'+(c[2]?'num':'')+'">'+(c[2]?fmt(val):esc(val))+'</td>';
  }).join('')+'<td class="act"><button class="ib" title="تعديل" data-ed="'+x.id+'">✏️</button><button class="ib" title="حذف" data-rm="'+x.id+'">🗑</button></td></tr>').join('')+'</tbody></table>'+(rows.length>shown.length?'<div class="empty"><button class="btn ghost sm" id="more">عرض المزيد ('+(rows.length-shown.length)+')</button></div>':'');
  t.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>editRow(col,b.dataset.ed));
  t.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>delRow(col,b.dataset.rm));
  t.querySelectorAll('[data-fo]').forEach(b=>b.onclick=()=>fileAct(col,b.dataset.fo,'open'));
  t.querySelectorAll('[data-fp]').forEach(b=>b.onclick=()=>fileAct(col,b.dataset.fp,'print'));
  $('#more')?.addEventListener('click',()=>{ui.limit+=300;tableBody(col)});
}
function editRow(col,id){
  const x=data[col].find(r=>r.id===id);if(!x)return;
  const m=document.createElement('div');m.className='modal';
  m.innerHTML='<div class="box"><h2>تعديل '+SCHEMA[col].title+'</h2></div>';
  const f=buildForm(col,x,{idp:'e_',submitLabel:'حفظ التعديل',onCancel:()=>m.remove(),onSubmit:async v=>{await store.update(col,id,v);m.remove();toast('اتحفظ التعديل ✓')}});
  m.firstChild.appendChild(f);

}
function exportCSV(col){
  const cols=TABLE_COLS[col].filter(c=>!c[3]);
  const rows=filtered(col).map(x=>cols.map(c=>'"'+String(c[0]==='note'&&x.place?(x.note?x.note+' — ':'')+'مكان: '+x.place:(x[c[0]]??'')).replace(/"/g,'""')+'"').join(','));
  download('﻿'+cols.map(c=>c[1]).join(',')+'\n'+rows.join('\n'),'infra-'+col+'-'+today()+'.csv','text/csv;charset=utf-8');
}
function download(text,name,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}

const nowStr=()=>{const d=new Date();return d.toLocaleDateString("en-GB")+" — "+d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})};
$('#tlogo').src=LOGO;$('#llogo').src=LOGO;$('#wm').src=LOGO;
function tick(){const d=new Date();$('#clkT').textContent=d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'});$('#clkD').textContent=d.toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
tick();setInterval(tick,1000);
const T0=document.title;
window.addEventListener('beforeprint',()=>{document.querySelectorAll('.ptime').forEach(e=>e.textContent=nowStr());const v=(VIEWS.find(x=>x[0]===view)||[])[1]||'';document.title='Infra Engineering Office - '+v+' - '+today()});
window.addEventListener('afterprint',()=>{document.title=T0});
const PHEADER=t=>'<div class="phead"><img src="'+LOGO+'"><div class="pt"><b>Infra Engineering Office</b><div>'+t+' — '+perLabel()+'</div><div>تاريخ ووقت الطباعة: <span class="ptime">'+nowStr()+'</span></div></div></div>';
const PHEAD=PHEADER;
function renderDash(){
  $('#view').innerHTML='<div class="tools noprint"><h2 style="margin:0">الداشبورد</h2><span style="margin-inline-start:auto"></span>'+periodSel()+
   '<select id="psel"><option value="all">طباعة: الكل</option><option value="sum">الملخص والصافي</option><option value="exp">المصروفات</option><option value="rev">الإيرادات</option><option value="cli">العملاء</option></select><button class="btn" style="background:var(--gold);color:#4a0f20" id="pbtn">🖨️ طباعة</button></div>'+
   PHEAD('تقرير الداشبورد')+
   '<div data-sec="sum"><div class="kpis" id="dk"></div><div class="card" style="margin-bottom:16px"><h3>الصافي شهرياً</h3><div class="tw"><table id="netm"></table></div></div></div>'+
   '<div data-sec="exp" class="card" style="margin-bottom:16px"><h3>المصروفات — كل قسم شهر بشهر</h3><div class="tw" id="bycat"></div></div>'+
   '<div data-sec="rev" class="card" style="margin-bottom:16px"><h3>الإيرادات — لكل شركة (الإجمالي وعدد الشيكات)</h3><div class="tw" id="byparty"></div><h3 style="margin-top:16px">حسب جهة الإيداع</h3><div id="bybank"></div></div>'+
   '<div data-sec="cli" class="card" style="margin-bottom:16px"><h3>العملاء الخارجيين — لكل عميل</h3><div class="tw" id="bycli"></div></div>';
  $('#per').onchange=e=>{ui.period=e.target.value;dashBody()};
  $('#pbtn').onclick=()=>printSec($('#psel').value);
  dashBody();
}
function dashBody(){
  if(!$('#dk'))return;
  const E=data.expenses.filter(inPer),R=data.revenues.filter(inPer),C=data.clients.filter(inPer);
  const te=sum(E),tc=sum(C),tr=sum(R),net=tr-te-tc;
  $('#dk').innerHTML='<div class="kpi g"><div class="l">الإيرادات</div><div class="v">'+fmt(tr)+'</div></div><div class="kpi r"><div class="l">المصروفات</div><div class="v">'+fmt(te)+'</div></div><div class="kpi p"><div class="l">العملاء الخارجيين</div><div class="v">'+fmt(tc)+'</div></div><div class="kpi n"><div class="l">الصافي</div><div class="v" style="color:'+(net<0?'var(--red)':'var(--green)')+'">'+fmt(net)+'</div></div>';
  const mm=[...new Set([...E,...R,...C].map(x=>(x.date||'').slice(0,7)).filter(Boolean))].sort();
  const by=(rows,m)=>sum(rows.filter(x=>(x.date||'').startsWith(m)));
  // الصافي شهرياً
  let h='<thead><tr><th>الشهر</th><th class="num">إيرادات</th><th class="num">مصروفات</th><th class="num">عملاء</th><th class="num">الصافي</th></tr></thead><tbody>';
  mm.forEach(m=>{const r=by(R,m),e=by(E,m),c=by(C,m),n=r-e-c;h+='<tr><td>'+m+'</td><td class="num">'+fmt(r)+'</td><td class="num">'+fmt(e)+'</td><td class="num">'+fmt(c)+'</td><td class="num" style="color:'+(n<0?'var(--red)':'var(--green)')+'">'+fmt(n)+'</td></tr>'});

/* ============================ القوائم والدفاتر (تلقائية) ============================ */
const CASH='النقدية والبنوك';
function buildJournal(){
  const J=[];
  const push=(c,x,dr,cr,desc)=>J.push({d:x.date||'',t:x.t||0,id:x.id,c,dr,cr,desc,amt:Number(x.amount)||0});
  data.expenses.forEach(x=>push('expenses',x,'مصروف - '+(x.category||'غير مصنف'),CASH,x.desc||x.category||''));
  data.revenues.forEach(x=>push('revenues',x,CASH,'إيراد - '+(x.party||'غير محدد'),(x.party||'')+(x.cheque?' — شيك/تحويل '+x.cheque:'')));
  data.clients.forEach(x=>push('clients',x,'دفعات عملاء - '+(x.name||'غير محدد'),CASH,(x.name||'')+(x.project?' — '+x.project:'')));
  J.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:a.t-b.t);
  J.forEach((e,i)=>e.n=i+1);
  return J;
}
function acctType(a){return a===CASH?0:a.startsWith('مصروف')?1:a.startsWith('دفعات')?2:3}

   '<div class="note noprint">كل ما تسجّل مصروف أو إيراد أو دفعة عميل بيتعمل له قيد يومية تلقائي، وبتتحدث الدفاتر والقوائم فوراً. الأساس <b>نقدي</b> (من غير أرصدة افتتاحية).</div>'+
   '<div class="seg4 noprint" id="ftabs">'+[['income','قائمة الدخل'],['pos','المركز المالي'],['trial','ميزان المراجعة'],['journal','دفتر اليومية'],['ledger','دفتر الأستاذ']].map(([k,l])=>'<button data-k="'+k+'" class="'+(ui.ftab===k?'on':'')+'">'+l+'</button>').join('')+'</div><div id="fbody" data-sec="f"></div>';

function finBody(){

  const rev=Object.entries(bal).filter(([a])=>acctType(a)===3).map(([a,b])=>[a.replace('إيراد - ',''),b.c-b.d]).sort((x,y)=>y[1]-x[1]);

      row('الإيرادات','','grp').replace('>0<','><')+rev.map(([a,v])=>row('   '+a,v)).join('')+row('إجمالي الإيرادات',trev,'grp')+
      row('المصروفات','','grp').replace('>0<','><')+exps.map(([a,v])=>row('   '+a,v)).join('')+row('إجمالي المصروفات',te,'grp')+
      row('دفعات العملاء الخارجيين','','grp').replace('>0<','><')+clis.map(([a,v])=>row('   '+a,v)).join('')+row('إجمالي دفعات العملاء',tc,'grp')+
      row('صافي الدخل (إيرادات − مصروفات − عملاء)',net,'grp')+'</tbody></table></div></div>';
  }else if(ui.ftab==='pos'){

      row('الأصول','','grp').replace('>0<','><')+row(CASH,cash)+row('إجمالي الأصول',cash,'grp')+
      row('حقوق الملكية','','grp').replace('>0<','><')+row('صافي الدخل للفترة',net)+row('إجمالي حقوق الملكية',net,'grp')+'</tbody></table></div><p class="muted">بدون أرصدة افتتاحية أو التزامات؛ رصيد النقدية = إجمالي الإيرادات − المصروفات − دفعات العملاء.</p></div>';
  }else if(ui.ftab==='trial'){

  }else if(ui.ftab==='journal'){

    h='<div class="card"><div class="tools noprint"><h3 style="margin:0">دفتر الأستاذ</h3><select id="facc" class="grow">'+accts.map(x=>'<option'+(x===a?' selected':'')+'>'+esc(x)+'</option>').join('')+'</select></div><h3 style="display:none" class="ponly">'+esc(a)+'</h3><div class="tw"><table><thead><tr><th>التاريخ</th><th>البيان</th><th>الحساب المقابل</th><th class="num">مدين</th><th class="num">دائن</th><th class="num">الرصيد</th></tr></thead><tbody>'+part.map(l=>'<tr><td style="white-space:nowrap">'+esc(l.e.d)+'</td><td>'+esc(l.e.desc)+'</td><td>'+esc(l.other)+'</td><td class="num">'+(l.d?fmt(l.d):'')+'</td><td class="num">'+(l.c?fmt(l.c):'')+'</td><td class="num">'+fmt(l.run)+'</td></tr>').join('')+'<tr class="grp"><td colspan="3">الإجمالي'+(lines.length>lim?' (الإجمالي لكل الحركات)':'')+'</td><td class="num">'+fmt(td)+'</td><td class="num">'+fmt(tcr)+'</td><td class="num">'+fmt(run)+'</td></tr></tbody></table></div>'+(lines.length>lim?'<div style="text-align:center;margin-top:10px" class="noprint"><button class="btn" id="more" style="background:var(--navy)">عرض المزيد ('+(lines.length-lim)+' سطر مخفي)</button></div>':'')+'</div>';

function invModal(x){

async function setStage(id,n){
  const x=data.invoices.find(r=>r.id===id);if(!x||n<1||n>9||n===x.stage)return;
  if(n===9&&!confirm('تأكيد: تم الصرف؟ الفاتورة هتتشال من التتابع وتروح للأرشيف.'))return;
  const sd={...(x.stageDates||{})};if(n>x.stage||!sd[n])sd[n]=today();
  for(const k of Object.keys(sd))if(+k>n)delete sd[k];
  try{await store.update('invoices',id,{stage:n,stageDates:sd,done:n===9,doneDate:n===9?today():null});toast(n===9?'تم الصرف ✓ اتشالت من التتابع':'المرحلة: '+STAGES[n-1])}catch(e){toast('ماتحفظش: '+(e.code||e.message))}
}

    '<h3>الفواتير حسب المرحلة</h3><table style="min-width:0"><thead><tr><th>المرحلة</th><th class="num">عدد الفواتير</th></tr></thead><tbody>'+stc.map(r=>'<tr><td>'+r[0]+'</td><td class="num">'+r[1]+'</td></tr>').join('')+'<tr class="grp"><td>الإجمالي</td><td class="num">'+list.length+'</td></tr></tbody></table>'+
    '<h3 style="margin-top:14px">الفواتير حسب المشروع</h3><table style="min-width:0"><thead><tr><th>المشروع</th><th>الجهة</th><th>رقم الفاتورة</th><th>التاريخ</th><th>عن شهر</th><th class="num">المبلغ</th><th>المرحلة الحالية</th></tr></thead><tbody>'+
    [...byP].sort((a,b)=>a[0].localeCompare(b[0],'ar')).map(([p,rows])=>rows.sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map((x,i)=>'<tr><td>'+(i?'':esc(p))+'</td><td>'+esc(x.party||'')+'</td><td>'+esc(x.no||'')+'</td><td>'+esc(x.date||'')+'</td><td>'+esc(x.forMonth||'')+'</td><td class="num">'+fmt(x.amount)+'</td><td>'+STAGES[(x.stage||1)-1]+'</td></tr>').join('')+'<tr class="grp"><td colspan="5">إجمالي '+esc(p)+' ('+rows.length+')</td><td class="num">'+fmt(sum(rows))+'</td><td></td></tr>').join('')+
    '<tr class="grp"><td colspan="5">الإجمالي العام ('+list.length+' فاتورة)</td><td class="num">'+fmt(sum(list))+'</td><td></td></tr></tbody></table>';
  $('#tprint').innerHTML=PHEADER('ملخص متابعة الفواتير'+(tk.arch?' (الأرشيف — تم الصرف)':'')).replace(' — '+perLabel(),'')+sumHtml;
  $('#tsm').textContent=tk.sum?'↩ عرض التفاصيل':'📋 ملخص الفواتير';
  if(tk.sum){box.innerHTML='<div class="card">'+sumHtml+'</div>';return}
  box.innerHTML=[...byP].sort((a,b)=>a[0].localeCompare(b[0],'ar')).map(([p,rows])=>{
    rows.sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.t||0)-(b.t||0));
    return '<div class="card party" style="margin-bottom:16px"><div class="phd"><h3 style="margin:0">📁 '+esc(p)+'</h3><span class="muted">'+rows.length+' فاتورة</span></div>'+rows.map(card).join('')+'<div class="ptot"><span>إجمالي المشروع ('+rows.length+' فاتورة)</span><b>'+fmt(sum(rows))+' ج.م</b></div></div>';
  }).join('');
  const g=(sel,fn)=>box.querySelectorAll(sel).forEach(b=>b.onclick=()=>fn(b));
  const cur=id=>data.invoices.find(r=>r.id===id);
  g('[data-next]',b=>setStage(b.dataset.next,cur(b.dataset.next).stage+1));
  g('[data-prev]',b=>setStage(b.dataset.prev,cur(b.dataset.prev).stage-1));
  g('[data-back]',b=>setStage(b.dataset.back,8));
  g('[data-sid]',b=>setStage(b.dataset.sid,+b.dataset.n));
  g('[data-ie]',b=>invModal(cur(b.dataset.ie)));
  g('[data-ir]',async b=>{if(!confirm('تمسح الفاتورة دي من المتابعة نهائياً؟'))return;try{await store.remove('invoices',b.dataset.ir);toast('اتمسحت')}catch(e){toast('ماتمسحتش: '+(e.code||e.message))}});
}

/* ============================ الإعدادات ============================ */
function renderSettings(){
  const counts=COLNAMES.map(c=>SCHEMA[c].sheet+': '+data[c].length).join(' — ');
  $('#view').innerHTML='<div class="card" style="margin-bottom:16px"><h2>حالة النظام</h2>'+(FB?'<p>متصل بـ Firebase (مشروع <b dir="ltr">'+esc(cfg.projectId)+'</b>). البيانات مشتركة بين كل الأجهزة.</p>':'<div class="note"><b>وضع تجريبي:</b> البيانات بتتحفظ على الجهاز ده بس. عشان تشتغل من أكتر من جهاز املا <code dir="ltr">FIREBASE_CONFIG</code> في أول ملف index.html.</div>')+'<p class="muted" id="cnt">'+counts+'</p></div>'
  +'<div class="card" style="margin-bottom:16px"><h2>استيراد بيانات الإكسيل</h2><p class="muted">اختار ملف <b dir="ltr">infra-data.json</b>. الاستيراد آمن لو اتعمل مرتين (مش بيكرر العمليات).</p><input type="file" id="imp" accept=".json,application/json"><div class="status hidden" id="impst"></div><div class="actions"><button class="btn ghost danger sm" id="delimp" style="color:#fff">حذف البيانات المستوردة فقط</button></div></div>'
  +'<div class="card"><h2>نسخة احتياطية</h2><p class="muted">تنزيل كل البيانات في ملف JSON.</p><div class="actions"><button class="btn ghost" id="bk">تنزيل نسخة احتياطية</button>'+(FB?'':'<button class="btn danger" id="reset">مسح بيانات الوضع التجريبي</button>')+'</div></div>';
  $('#imp').onchange=async e=>{
    const file=e.target.files[0];if(!file)return;
    const st=$('#impst');st.classList.remove('hidden');st.className='status';
    try{
      const j=JSON.parse(await file.text());
      const n=COLNAMES.map(c=>(j[c]||[]).length);
      if(!n.some(x=>x>0))throw new Error('الملف مش بصيغة صحيحة');
      if(!confirm('هيتم استيراد '+n[0]+' مصروف و '+n[1]+' إيراد و '+n[2]+' دفعة عميل. نكمل؟'))return;
      for(let i=0;i<3;i++){st.textContent='جاري استيراد '+SCHEMA[COLNAMES[i]].sheet+'...';await store.importRows(COLNAMES[i],(j[COLNAMES[i]]||[]).map(r=>{const {src,...x}=r;if(!x.id)throw new Error('الملف ناقص معرّفات');return x}))}
      st.className='status ok';st.textContent='تم الاستيراد بنجاح ✓';
    }catch(ex){st.className='status err';st.textContent='فشل الاستيراد: '+(ex.code||ex.message)}
    e.target.value='';
  };
  $('#delimp').onclick=async()=>{
    const ids=COLNAMES.map(c=>[c,data[c].filter(x=>String(x.id).startsWith('imp-')).map(x=>x.id)]);
    const tot=ids.reduce((s,x)=>s+x[1].length,0);
    if(!tot)return toast('مفيش بيانات مستوردة');
    if(!confirm('هيتم حذف '+tot+' عملية مستوردة. متأكد؟'))return;
    for(const [c,a] of ids)if(a.length)await store.removeMany(c,a);
    toast('تم الحذف');
  };
  $('#bk').onclick=()=>download(JSON.stringify({version:1,exportedAt:new Date().toISOString(),...data},null,1),'infra-backup-'+today()+'.json','application/json');
  $('#reset')&&($('#reset').onclick=()=>{if(confirm('هيتم مسح كل بيانات الوضع التجريبي. متأكد؟')){store.resetLocal();toast('تم المسح')}});
}

/* ============================ التنقل والتشغيل ============================ */
function go(v){view=v;location.hash=v;render()}
function renderNav(){
  $('#nav').innerHTML=VIEWS.map(([k,l])=>'<button data-v="'+k+'" class="'+(k===view?'on':'')+'">'+(ICONS[k]||'')+'<span>'+l+'</span></button>').join('');
  $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{document.body.classList.remove('open');go(b.dataset.v)});
  $('#burger').onclick=()=>document.body.classList.toggle('open');$('#bd').onclick=()=>document.body.classList.remove('open');
}
function render(){
  renderNav();
  if(view==='entry')renderEntry();
  else if(COLNAMES.includes(view)){ui.limit=200;renderTable(view)}
  else if(view==='dash')renderDash();
  else if(view==='track')renderTrack();
  else if(view==='fin')renderFin();
  else renderSettings();
  refreshLists();
  scrollTo(0,0);
}
function onData(c){
  if(c==='invoices'){if(view==='track')trackBody();return}
  refreshLists();
  if(view==='entry'){renderEntryKpi();renderRecent();const cs=$('#f_category');if(cs&&cs.options.length-1!==allCategories().length){const cur=cs.value;mountEntryForm();const n=$('#f_category');if(n)n.value=cur}}
  else if(view===c)tableBody(c);
  else if(view==='dash')dashBody();
  else if(view==='fin')finBody();
  else if(view==='settings'){const c=$('#cnt');if(c)c.textContent=COLNAMES.map(k=>SCHEMA[k].sheet+': '+data[k].length).join(' — ')}
}
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!==view&&VIEWS.some(v=>v[0]===h)){view=h;render()}});
$('#mode').textContent=FB?'متصل':'وضع تجريبي';$('#mode').className='badge'+(FB?'':' demo');
$('#logout').onclick=()=>store.signOut();
$('#loginForm').onsubmit=async e=>{
  e.preventDefault();const er=$('#lErr');er.classList.add('hidden');$('#lBtn').disabled=true;
  try{await store.signIn($('#lEmail').value.trim(),$('#lPass').value)}catch(ex){er.textContent='الإيميل أو الباسورد غلط';er.classList.remove('hidden')}
  $('#lBtn').disabled=false;
};
let started=false;
store.onAuth(u=>{
  user=u;
  $('#login').classList.toggle('hidden',!!u);
  $('#who').textContent=u?u.email:'';
  $('#logout').classList.toggle('hidden',!(u&&FB));
  if(u&&!started){
    started=true;
    [...COLNAMES,'invoices'].forEach(c=>store.subscribe(c,rows=>{data[c]=rows;onData(c)}));
    render();
  }
});
</script>
</body>
</html>
